<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Class Example | Divs </title>
        <link rel="stylesheet" href="divs.css">
    </head>
<body>

<div class="bigBox">
    <div class="smallBox red"> 
        <h1>Divs</h1>
        <p> These are some divs.</p>
    </div>

    <div class="smallBox blue"> 
        <h1> Second Box</h1>
        <p>This is the second box</p>
    </div>
 
<div class="smallBox thirdBox">

    <div class="leftBox">
        <h1> Left Box</h1>
        <p> This is the left box.</p>
    </div>

    <div class="rightBox">

        <div class="topBox">
            <h1> Right Box</h1>
            <p> This is the right box.</p>
        </div>

        <div class="bottomBox">
            <h1> Bottom Box</h1>
            <p> This is the bottom box.</p>
        </div>
    </div>
</div>
</div>  

</body>

</html>
