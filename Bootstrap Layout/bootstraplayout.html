<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout Exercise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">

</head>

<body>
    <div class="container bg-subtle-secondary">
        <div class="row">
            <div class="col border border-black p-5">
                <h1>Bootstrap Layout</h1>
            </div>
        </div>
        <div class="row g-0">
            <div class="col-5 border border-black p-5">
                <h2> Sidebar </h2>
            </div>
            <div class="col-7 border border-black p-4">
                <div class="row g-0">
                    <div class="col-3 border border-black">
                        <h2> 3 </h2>
                    </div>
                    <div class="col-9 border border-black">
                        <h2> 9 </h2>
                    </div>
                </div>
                <div class="row g-0">
                    <div class="col-6 border border-black">
                        <h2> 6 </h2>
                    </div>
                    <div class="col-6 border border-black">
                        <h2> 6 </h2>
                    </div>
                </div>
                <div class="row g-0">
                    <div class="col-2 border border-black">
                        <h2> 2 </h2>
                    </div>
                    <div class="col-8 border border-black">
                        <h2> 8 </h2>
                    </div>
                    <div class="col-2 border border-black">
                        <h2> 2 </h2>
                    </div>
                </div>
                <div class="row g-0">
                    <div class="col-1 border border-black">
                        <h2> 1 </h2>
                    </div>
                    <div class="col-4 border border-black">
                        <h2> 4 </h2>
                    </div>
                    <div class="col-6 border border-black">
                        <h2> 6 </h2>
                    </div>
                    <div class="col-1 border border-black">
                        <h2> 1 </h2>
                    </div>
                </div>
            </div>

        </div>
        <div class="row">
            <div class="col border border-black p-5">
                <h2> Footer </h2>
            </div>
        </div>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+"
        crossorigin="anonymous"></script>
</body>

</html>
